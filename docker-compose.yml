# Local / VPS deploy: `docker compose up -d --build`
# Data persists in volume `dps_sqlite` at /data/dev.db inside the container.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: file:/data/dev.db
      # Optional: set GEMINI_API_KEY, OPENAI_API_KEY, ADMIN_REGISTER_SECRET here or use:
      #   docker compose --env-file .env up -d
    volumes:
      - dps_sqlite:/data
    restart: unless-stopped

volumes:
  dps_sqlite:
