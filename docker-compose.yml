services:
  app:
    image: dpsheating:v1
    mem_limit: 512m
    memswap_limit: 768m
    expose:
      - "3000"
    environment:
      DATABASE_URL: file:/data/dev.db
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ADMIN_REGISTER_SECRET: ${ADMIN_REGISTER_SECRET:-}
      NODE_OPTIONS: "--max-old-space-size=256"
    volumes:
      - dps_sqlite:/data
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx:/etc/nginx/conf.d
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
    depends_on:
      - app
    restart: unless-stopped

volumes:
  dps_sqlite: