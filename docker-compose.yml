version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env.example
    ports:
      - "8000:8000"
    volumes:
      - ./:/app
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        # Host browser calls this URL; from your machine, backend published port is 8000.
        REACT_APP_PHI_DPS_API_BASE: http://127.0.0.1:8000
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
